[project]
name = "robot-llm-command-experiment"
version = "0.1.0"
description = "Control an FRC robot over NetworkTables using an LLM agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyntcore>=2026.2.2",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
robot-llm = "robot_llm.cli:main"
robot-llm-server = "robot_llm.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_llm"]
